<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito | Cortex Systems</title>
    <!-- Asegúrate de que el archivo style.css exista en la misma carpeta -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para la tabla y resumen del carrito */
        .cart-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: white; 
        }
        .cart-table th { 
            background: #b9d1ea; 
            color: #000; 
            padding: 12px; 
            border: 1px solid #000; 
        }
        .cart-table td { 
            padding: 12px; 
            border: 1px solid #000; 
            text-align: center; 
            color: #000; 
        }
        
        /* Controles de cantidad (+ y -) */
        .qty-controls { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        .btn-qty { 
            background: #000; 
            color: #fff; 
            border: none; 
            width: 28px; 
            height: 28px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 4px; 
        }
        .qty-num { 
            font-weight: bold; 
            min-width: 25px; 
            font-size: 1.1rem; 
        }

        /* Caja de resumen de pago */
        .summary-box {
            margin-top: 2rem; 
            background: #fff; 
            padding: 25px;
            border: 2px solid #000; 
            max-width: 450px; 
            margin-left: auto;
        }
        .summary-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px; 
            font-weight: bold; 
            color: #000; 
        }
        .total-final { 
            font-size: 1.6rem; 
            border-top: 2px solid #000; 
            padding-top: 12px; 
        }

        /* Botón Confirmar */
        .btn-confirmar {
            display: block; 
            width: 100%; 
            background-color: #000; 
            color: #fff; 
            padding: 18px; 
            border: none; 
            cursor: pointer;
            font-weight: bold; 
            font-size: 1.2rem; 
            margin-top: 15px; 
            text-transform: uppercase;
            border-radius: 5px;
        }
        .btn-confirmar:hover { 
            background-color: #333; 
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">CORTEX<span>SYSTEMS</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <!-- Marcamos el carrito como activo -->
                <li><a href="carrito.html" style="color: #b9d1ea;">🛒 Mi Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main class="container" style="padding: 20px;">
        <h2 id="cart-title" style="margin-top: 2rem; color: #000; font-weight: bold;">Tu Carrito de Compras</h2>
        
        <!-- Contenido dinámico del carrito -->
        <div id="cart-content">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Cant.</th>
                        <th>Descripción</th>
                        <th>Precio Unit.</th>
                        <th>IVA (16%)</th>
                        <th>Subtotal (c/IVA)</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cart-items">
                    <!-- Las filas se generan desde cart.js -->
                </tbody>
            </table>

            <div class="summary-box">
                <div class="summary-row">
                    <span>TOTAL NETO:</span>
                    <span id="display-subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>IVA TOTAL (16%):</span>
                    <span id="display-iva">$0.00</span>
                </div>
                <div class="summary-row total-final">
                    <span>TOTAL A PAGAR:</span>
                    <span id="display-total">$0.00 MXN</span>
                </div>
                
                <!-- Este botón llama a la función en cart.js -->
                <button onclick="procesarCompraFinal()" class="btn-confirmar">
                    CONFIRMAR Y PAGAR
                </button>
            </div>
        </div>

        <!-- Mensaje si el carrito está vacío -->
        <div id="empty-msg" style="display: none; text-align: center; padding: 5rem 0;">
            <p style="font-size: 2rem; font-weight: bold; color: #000; margin-bottom: 2rem;">Tu carrito está vacío actualmente.</p>
            <a href="productos.html" class="btn-confirmar" style="display: inline-block; width: auto; padding: 15px 40px; text-decoration: none;">Ir a Productos</a>
        </div>
    </main>

    <!-- CRITICAL: Vinculación de tu archivo lógico -->
    <script src="cart.js"></script>
</body>
</html>
