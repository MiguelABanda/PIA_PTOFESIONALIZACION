<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Cortex Systems</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">CORTEX<span>SYSTEMS</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html" style="color: var(--accent);">🛒 Mi Carrito</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="contact-wrapper">
            <div class="contact-info">
                <h2>Ponte en contacto</h2>
                <p>¿Tienes dudas sobre compatibilidad o necesitas una cotización empresarial?</p>
                <p><strong>Ubicación:</strong> Monterrey, N.L., México</p>
                <p><strong>Email:</strong> soporte@cortexsystems.tech</p>
            </div>

            <form class="contact-form">
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <select>
                    <option>Consulta Técnica</option>
                    <option>Ventas al mayoreo</option>
                    <option>Garantías</option>
                </select>
                <textarea placeholder="¿En qué podemos ayudarte?" rows="5"></textarea>
                <button type="submit" class="btn">Enviar Mensaje</button>
            </form>
        </div>
    </main>
</body>
</html>
